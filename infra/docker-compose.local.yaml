services:
  # ===== FRONTEND (Next.js) =====
  frontend:
    build:
      context: ../frontend-new
      dockerfile: Dockerfile
      target: dev   # если ты сделал multi-stage; если нет — убери строку
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # SSR (server-side) — внутренняя Docker-сеть
      CONTENT_API_BASE: http://content-api:8000/api/v1
      AGENT_API_BASE: http://rag-api:8000
      # Client-side (браузер) — внешние порты
      NEXT_PUBLIC_CONTENT_API_BASE: ${NEXT_PUBLIC_CONTENT_API_BASE:-http://localhost:${CONTENT_PORT:-8003}/api/v1}
      NEXT_PUBLIC_AGENT_API_BASE: ${NEXT_PUBLIC_AGENT_API_BASE:-http://localhost:${RAG_NEW_PORT:-8004}}
      NEXT_PUBLIC_CHARS_PER_SECOND: ${NEXT_PUBLIC_CHARS_PER_SECOND:-60}
      NEXT_PUBLIC_MAX_CHARS_PER_TICK: ${NEXT_PUBLIC_MAX_CHARS_PER_TICK:-4}
      NEXT_PUBLIC_MAX_INPUT_TOKENS: ${NEXT_PUBLIC_MAX_INPUT_TOKENS:-100}
      NEXT_PUBLIC_CHARS_PER_TOKEN: ${NEXT_PUBLIC_CHARS_PER_TOKEN:-4}
    ports:
      - "3000:3000"
    # супер желательно для dev:
    volumes:
      - ../frontend-new:/app
      - /app/node_modules
    command: [ "npm","run","dev","--","-H","0.0.0.0","-p","3000" ]
    depends_on:
      - content-api
      - rag-api

  # ===== POSTGRES =====
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ===== CONTENT API =====
  content-api:
    build:
      context: ../services/content-api-new
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # ВАЖНО: ходим в postgres по имени сервиса, внутри docker-сети
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: INFO
      APP_ENV: dev
    command: >
      sh -lc "alembic upgrade head &&
              python -m app.seed.seed_ai_portfolio_new &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${CONTENT_PORT:-8003}:8000"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ===== CHROMA =====
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTH_ENABLED: "false"
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    command: ["run", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== TEI (embeddings) =====
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    restart: unless-stopped
    environment:
      MODEL_ID: /data/model
      HF_ENDPOINT: ""
      HUGGINGFACE_HUB_BASE_URL: ""
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    ports:
      - "${TEI_PORT:-8006}:80"
    volumes:
      - ./models/intfloat/multilingual-e5-base:/data/model:ro
    command: ["--model-id", "/data/model", "--auto-truncate"]

  # ===== LiteLLM (единая точка входа к LLM/Embeddings) =====
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-8005}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - tei

  # ===== REDIS (cache) =====
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ===== RAG API =====
  rag-api:
    build:
      context: ../services/rag-api-new
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # === LiteLLM (unified LLM proxy) ===
      litellm_base_url: http://litellm:4000/v1
      litellm_api_key: ${LITELLM_MASTER_KEY}
      chat_model: ${CHAT_MODEL}
      embedding_model: ${EMBEDDING_MODEL}
      # === Provider Credentials ===
      giga_auth_data: ${GIGA_AUTH_DATA}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      # === LLM Roles (format: provider:model) ===
      IDENTITY_LLM: ${IDENTITY_LLM:-deepseek:deepseek-chat}
      PLANNER_LLM: ${PLANNER_LLM:-gigachat:GigaChat-2}
      ANSWER_LLM: ${ANSWER_LLM:-deepseek:deepseek-chat}
      CRITIC_LLM: ${CRITIC_LLM:-deepseek:deepseek-reasoner}
      AGENT_LLM: ${AGENT_LLM:-gigachat:GigaChat-2}
      ROUTER_LLM: ${ROUTER_LLM:-deepseek:deepseek-chat}
      # === LLM Temperatures ===
      IDENTITY_TEMPERATURE: ${IDENTITY_TEMPERATURE:-0.3}
      PLANNER_TEMPERATURE: ${PLANNER_TEMPERATURE:-0.0}
      ANSWER_TEMPERATURE: ${ANSWER_TEMPERATURE:-0.2}
      CRITIC_TEMPERATURE: ${CRITIC_TEMPERATURE:-0.2}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
      ROUTER_TEMPERATURE: ${ROUTER_TEMPERATURE:-0.0}
      # === TEI (embeddings direct access) ===
      TEI_BASE_URL: http://tei:80/v1
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      # === Reranker ===
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      MAX_RERANK_CANDIDATES: ${MAX_RERANK_CANDIDATES:-80}
      # === Chroma ===
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      chroma_collection: ${CHROMA_COLLECTION:-portfolio_new}
      ANONYMIZED_TELEMETRY: "false"
      # === CORS ===
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      FRONTEND_LOCAL_IP: ${FRONTEND_LOCAL_IP:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # === Redis/Cache ===
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      PLAN_CACHE_TTL: ${PLAN_CACHE_TTL:-0}
      EMBEDDING_CACHE_TTL: ${EMBEDDING_CACHE_TTL:-0}
      # === Critic ===
      CRITIC_ENABLED: ${CRITIC_ENABLED:-true}
      CRITIC_CONFIDENCE_THRESHOLD: ${CRITIC_CONFIDENCE_THRESHOLD:-0.7}
      CRITIC_MIN_FACTS_THRESHOLD: ${CRITIC_MIN_FACTS_THRESHOLD:-2}
      # === Rate Limiting ===
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_IP_TOKENS: ${RATE_LIMIT_IP_TOKENS:-50000}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      RATE_LIMIT_WARNING_THRESHOLD: ${RATE_LIMIT_WARNING_THRESHOLD:-0.8}
      RATE_LIMIT_LOG_IP_MODE: ${RATE_LIMIT_LOG_IP_MODE:-masked}
      # === User Input Validation ===
      MAX_USER_INPUT_TOKENS: ${MAX_USER_INPUT_TOKENS:-250}
      # === SMTP Email (CV sending) ===
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI-Portfolio | Dmitry}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # === CV File & Rate Limits ===
      CV_FILE_PATH: ${CV_FILE_PATH:-/app/data/cv.pdf}
      CV_ATTACHMENT_NAME: ${CV_ATTACHMENT_NAME:-}
      CV_SEND_LIMIT_PER_IP: ${CV_SEND_LIMIT_PER_IP:-3}
      CV_SEND_LIMIT_PER_EMAIL: ${CV_SEND_LIMIT_PER_EMAIL:-2}
      CV_SEND_LIMIT_WINDOW_SECONDS: ${CV_SEND_LIMIT_WINDOW_SECONDS:-3600}
      # === Site Domain (for email links) ===
      DOMAIN: ${DOMAIN:-}
    ports:
      - "${RAG_NEW_PORT:-8004}:8000"
    volumes:
      - ../data/cv.pdf:/app/data/cv.pdf:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - chroma
      - litellm
      - redis

  # ===== ONE-SHOT: экспорт из content-api -> ingest в rag-api =====
  # Запускается при `up`, делает ingest и завершается.
    # ===== ONE-SHOT: export -> ingest =====
  rag-ingest:
    image: python:3.12-slim
    restart: "no"
    depends_on:
      - content-api
      - rag-api
    environment:
      EXPORT_URL: http://content-api:8000/api/v1/rag/export
      INGEST_URL: http://rag-api:8000/api/v1/ingest/batch
      # Если у rag-api есть /healthz — включи:
      # RAG_HEALTH_URL: http://rag-api:8000/healthz
    volumes:
      - ./scripts:/scripts:ro
    command: [ "python", "/scripts/ingest.py" ]

volumes:
  pg_data:
  chroma_data:
  tei_cache:
  redis_data:
